name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write
  actions: write

jobs:
  # The Mac app is sealed with an ad-hoc signature, which needs codesign, so it is built on macOS. The
  # binary inside is built with the same flags as below; the zips join the release's signed sums.
  mac-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'

      - name: Build the Mac app
        # One universal binary (Apple silicon and Intel) in one app, so the user has one download to choose.
        # The app is signed ad hoc only: the project does not plan a Developer ID signature, so macOS asks for
        # "Open Anyway" on the first open. The Mac app is the fallback for users without a Bot; the Bot installs
        # Rubi Home without it. See docs/design/rubi-home.md ("The Mac app")
        run: bash scripts/build-mac-app.sh "$GITHUB_REF_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: mac-app
          path: app/*.zip
          if-no-files-found: error

  # Rubi Home for Windows: rubi-home.exe, not Authenticode-signed (the project does not plan a code-signing certificate), in a
  # zip that the signed SHA256SUMS lists. The Bot's installer (panel/install-home.ps1) checks that signature and the zip's
  # hash before it unpacks a byte. Built here, tested on a Windows runner next, then joined to the release.
  windows-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the Windows zips
        run: |
          set -euo pipefail
          mkdir -p windows
          for arch in amd64 arm64; do
            out="work/home-windows-$arch"
            mkdir -p "$out"
            CGO_ENABLED=0 GOOS=windows GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -buildid= -X github.com/Deikus-LXXVII/rubi/internal/version.Version=${GITHUB_REF_NAME}" \
              -o "$out/rubi-home.exe" ./cmd/rubi-home
            touch -d @0 "$out/rubi-home.exe"
            (cd "$out" && zip -X -q -9 "$GITHUB_WORKSPACE/windows/rubi-home-${GITHUB_REF_NAME}-windows-$arch.zip" rubi-home.exe)
          done
          ls -l windows

      - uses: actions/upload-artifact@v4
        with:
          name: windows-home
          path: windows/*.zip
          if-no-files-found: error

  # The zip that will be released is unpacked and run on Windows before anything is published.
  windows-check:
    needs: windows-home
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-home
          path: windows
      - name: The program starts and is this release
        shell: pwsh
        run: |
          $zip = Join-Path $PWD "windows/rubi-home-$env:GITHUB_REF_NAME-windows-amd64.zip"
          Expand-Archive -LiteralPath $zip -DestinationPath exe
          $out = (& ./exe/rubi-home.exe version | Out-String).Trim()
          Write-Output $out
          if ($LASTEXITCODE -ne 0 -or $out -notmatch [regex]::Escape($env:GITHUB_REF_NAME)) { throw "rubi-home.exe version said: $out" }
      - name: Each zip holds the one program, for its CPU
        # The installer takes the entry named rubi-home.exe and nothing else. The arm64 program cannot run on this runner, so it is
        # looked at: one entry with that name, and a Windows program for the ARM64 machine type (0xAA64; amd64 is 0x8664).
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($case in @(@('amd64', 0x8664), @('arm64', 0xAA64))) {
            $zip = Join-Path $PWD "windows/rubi-home-$env:GITHUB_REF_NAME-windows-$($case[0]).zip"
            $za = [System.IO.Compression.ZipFile]::OpenRead($zip)
            try {
              $names = @($za.Entries | ForEach-Object { $_.FullName })
              if ($names.Count -ne 1 -or $names[0] -cne 'rubi-home.exe') { throw "$zip holds: $($names -join ', ')" }
              $in = $za.Entries[0].Open()
              $head = New-Object byte[] 4096
              [void]$in.Read($head, 0, $head.Length)
              $in.Dispose()
            } finally { $za.Dispose() }
            if ($head[0] -ne 0x4D -or $head[1] -ne 0x5A) { throw "$zip is not a Windows program" }
            $machine = [BitConverter]::ToUInt16($head, [BitConverter]::ToInt32($head, 0x3C) + 4)
            if ($machine -ne $case[1]) { throw ("{0}: machine type {1:X} is not {2:X}" -f $zip, $machine, $case[1]) }
          }

  release:
    needs: [mac-app, windows-check]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
      - name: Runtime build prerequisites
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu make

      - name: Test
        run: go test -race ./...

      - uses: actions/download-artifact@v4
        with:
          name: mac-app
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: windows-home
          path: dist

      - name: Build
        run: |
          set -euo pipefail
          mkdir -p dist/bin
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            out="dist/work/$os-$arch"
            mkdir -p "$out"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -buildid= -X github.com/Deikus-LXXVII/rubi/internal/version.Version=${GITHUB_REF_NAME}" \
              -o "$out/rubi" ./cmd/rubi
            cp "$out/rubi" "dist/bin/rubi-$os-$arch"
            tar --owner=0 --group=0 --numeric-owner --mtime=@0 -C "$out" -czf "dist/rubi-${GITHUB_REF_NAME}-$os-$arch.tar.gz" rubi
          done
          # Rubi Home, the helper for a computer at home (a Mac, or a Linux box like a Raspberry Pi).
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os=${target%/*}; arch=${target#*/}
            out="dist/work/home-$os-$arch"
            mkdir -p "$out"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -buildid= -X github.com/Deikus-LXXVII/rubi/internal/version.Version=${GITHUB_REF_NAME}" \
              -o "$out/rubi-home" ./cmd/rubi-home
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -buildid=" -o "$out/rubi-agent-exec" ./cmd/rubi-agent-exec
            cc=cc; if [ "$os-$arch" = linux-arm64 ]; then cc=aarch64-linux-gnu-gcc; fi
            python3 scripts/srt-runtime/build.py --platform "$os-$arch" --dest "$out" --cc "$cc"
            tar --owner=0 --group=0 --numeric-owner --mtime=@0 -C "$out" -czf "dist/rubi-home-${GITHUB_REF_NAME}-$os-$arch.tar.gz" rubi-home rubi-agent-exec srt-runtime
          done
          # The Mac app zips came from the mac-app job (above, in dist/), the Windows zips from the windows-home job; the
          # tar.gz files stay for the script installer and Linux.
          ls dist/rubi-home-*-macos-universal.zip dist/rubi-home-"${GITHUB_REF_NAME}"-windows-amd64.zip dist/rubi-home-"${GITHUB_REF_NAME}"-windows-arm64.zip
          cd dist
          # Archives and Mac app zips for the installers, plus the bare binaries for Rubi's self-check.
          sha256sum rubi-*.tar.gz rubi-*.zip bin/rubi-* > SHA256SUMS
          cat SHA256SUMS

      - name: Sign checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_SIGNING_KEY" || { echo "RELEASE_SIGNING_KEY secret is not set"; exit 1; }
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/key.pem" -rawin -in dist/SHA256SUMS -out dist/SHA256SUMS.sig
          rm -f "$RUNNER_TEMP/key.pem"
          # The signature must verify with the public key that install.sh and the binary embed.
          openssl pkeyutl -verify -pubin -inkey release-key.pub.pem -rawin -in dist/SHA256SUMS -sigfile dist/SHA256SUMS.sig
          # The Windows installer checks the signature with its own code: run that code on this release's real files, so a
          # release it would refuse is never published.
          pwsh -NoProfile -File scripts/test-install-home-ed25519.ps1 -Sums dist/SHA256SUMS -Sig dist/SHA256SUMS.sig

      - name: Provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/rubi-*.tar.gz, dist/rubi-*.zip, dist/bin/rubi-*"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in v0.*|*-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/rubi-*.tar.gz dist/rubi-*.zip dist/SHA256SUMS dist/SHA256SUMS.sig \
            --title "$GITHUB_REF_NAME" --generate-notes $flags

      - name: Refresh the release feed on rubi-panel.com
        # Installed Rubis read releases/latest.json from the site; redeploying the site regenerates it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
