name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write
  actions: write

jobs:
  # The Mac app is sealed with an ad-hoc signature, which needs codesign, so it is built on macOS. The
  # binary inside is built with the same flags as below; the zips join the release's signed sums.
  mac-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the Mac app
        # One universal binary (Apple silicon and Intel) in one app, so the user has one download to choose.
        run: |
          set -euo pipefail
          mkdir -p app work/home-darwin-universal
          for arch in arm64 amd64; do
            out="work/home-darwin-$arch"
            mkdir -p "$out"
            CGO_ENABLED=0 GOOS=darwin GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -buildid= -X github.com/Deikus-LXXVII/rubi/internal/version.Version=${GITHUB_REF_NAME}" \
              -o "$out/rubi-home" ./cmd/rubi-home
          done
          lipo -create -output work/home-darwin-universal/rubi-home work/home-darwin-arm64/rubi-home work/home-darwin-amd64/rubi-home
          lipo -archs work/home-darwin-universal/rubi-home
          RUBI_APP_SIGN=adhoc sh scripts/build-home-app.sh "$GITHUB_REF_NAME" universal work/home-darwin-universal/rubi-home app
          # TODO(macOS signing): sign and notarize "Rubi Home.app" with a Developer ID, so macOS opens it without
          # "Open Anyway". It needs these secrets, and must be skipped cleanly when they are not set:
          # MACOS_SIGN_IDENTITY, MACOS_CERTIFICATE (base64 .p12), MACOS_CERTIFICATE_PASSWORD,
          # MACOS_NOTARY_APPLE_ID, MACOS_NOTARY_PASSWORD, MACOS_NOTARY_TEAM_ID. Until then the app is signed ad
          # hoc only. See docs/design/rubi-home.md ("Opening an unsigned app").

      - uses: actions/upload-artifact@v4
        with:
          name: mac-app
          path: app/*.zip
          if-no-files-found: error

  release:
    needs: mac-app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race ./...

      - uses: actions/download-artifact@v4
        with:
          name: mac-app
          path: dist

      - name: Build
        run: |
          set -euo pipefail
          mkdir -p dist/bin
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            out="dist/work/$os-$arch"
            mkdir -p "$out"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -buildid= -X github.com/Deikus-LXXVII/rubi/internal/version.Version=${GITHUB_REF_NAME}" \
              -o "$out/rubi" ./cmd/rubi
            cp "$out/rubi" "dist/bin/rubi-$os-$arch"
            tar --owner=0 --group=0 --numeric-owner --mtime=@0 -C "$out" -czf "dist/rubi-${GITHUB_REF_NAME}-$os-$arch.tar.gz" rubi
          done
          # Rubi Home, the helper for a computer at home (a Mac, or a Linux box like a Raspberry Pi).
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os=${target%/*}; arch=${target#*/}
            out="dist/work/home-$os-$arch"
            mkdir -p "$out"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -buildid= -X github.com/Deikus-LXXVII/rubi/internal/version.Version=${GITHUB_REF_NAME}" \
              -o "$out/rubi-home" ./cmd/rubi-home
            tar --owner=0 --group=0 --numeric-owner --mtime=@0 -C "$out" -czf "dist/rubi-home-${GITHUB_REF_NAME}-$os-$arch.tar.gz" rubi-home
          done
          # The Mac app zips came from the mac-app job (above, in dist/); the tar.gz files stay for the script
          # installer and Linux.
          ls dist/rubi-home-*-macos-universal.zip
          cd dist
          # Archives and Mac app zips for the installers, plus the bare binaries for Rubi's self-check.
          sha256sum rubi-*.tar.gz rubi-*.zip bin/rubi-* > SHA256SUMS
          cat SHA256SUMS

      - name: Sign checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_SIGNING_KEY" || { echo "RELEASE_SIGNING_KEY secret is not set"; exit 1; }
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/key.pem" -rawin -in dist/SHA256SUMS -out dist/SHA256SUMS.sig
          rm -f "$RUNNER_TEMP/key.pem"
          # The signature must verify with the public key that install.sh and the binary embed.
          openssl pkeyutl -verify -pubin -inkey release-key.pub.pem -rawin -in dist/SHA256SUMS -sigfile dist/SHA256SUMS.sig

      - name: Provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/rubi-*.tar.gz, dist/rubi-*.zip, dist/bin/rubi-*"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in v0.*|*-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/rubi-*.tar.gz dist/rubi-*.zip dist/SHA256SUMS dist/SHA256SUMS.sig \
            --title "$GITHUB_REF_NAME" --generate-notes $flags

      - name: Refresh the release feed on rubi-panel.com
        # Installed Rubis read releases/latest.json from the site; redeploying the site regenerates it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
