name: pages

# Publishes the static panel (panel/) to GitHub Pages at https://rubi-panel.com.
on:
  push:
    branches: [main]
    paths: ["panel/**", "marketplace/**", "deploy/pages/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Release feed
        # rubi-panel.com/releases/latest.json is how installed Rubis discover updates (static, no API limits).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p panel/releases
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=20" | jq -f deploy/pages/latest.jq \
            > panel/releases/latest.json
          cat panel/releases/latest.json
      - name: Instructions for the Bot
        # The install message the user sends their Bot names rubi-panel.com/install.md, so the user never sees a
        # shell line (project rule 2): the Bot reads how to install and use Rubi there. It is the Bot skill itself.
        run: cp skills/grok-bot/rubi-project/SKILL.md panel/install.md
      - name: Plugin catalog
        # rubi-panel.com/marketplace/catalog.json lists the reviewed plugins. Rubi trusts it only with a valid
        # signature from the release key, so it is signed here, from the reviewed file in the repository.
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_SIGNING_KEY" || { echo "RELEASE_SIGNING_KEY secret is not set"; exit 1; }
          python3 -c 'import json,sys; c=json.load(open("marketplace/catalog.json")); assert c["schema"]==1'
          mkdir -p panel/marketplace
          cp marketplace/catalog.json panel/marketplace/catalog.json
          umask 077
          trap 'rm -f "$RUNNER_TEMP/key.pem"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/key.pem" -rawin -in panel/marketplace/catalog.json \
            -out panel/marketplace/catalog.json.sig
          # The release feed is signed too (raw Ed25519 over the exact bytes of latest.json): installers and
          # updaters take the version only from verified bytes (the release-version rule, docs/design/rubi-home.md).
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/key.pem" -rawin -in panel/releases/latest.json \
            -out panel/releases/latest.json.sig
          rm -f "$RUNNER_TEMP/key.pem"
          openssl pkeyutl -verify -pubin -inkey release-key.pub.pem -rawin -in panel/marketplace/catalog.json \
            -sigfile panel/marketplace/catalog.json.sig
          openssl pkeyutl -verify -pubin -inkey release-key.pub.pem -rawin -in panel/releases/latest.json \
            -sigfile panel/releases/latest.json.sig
      - name: Version the panel's files
        # Browsers may keep rubi-panel.com files for hours; versioned URLs make a new release load at once.
        run: python3 deploy/pages/version-assets.py panel "${GITHUB_SHA::12}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: panel
      - id: deploy
        uses: actions/deploy-pages@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Announce to installed Rubis
        # A signed hint on the Nostr relays: installed Rubis check for Rubi and plugin updates at once
        # instead of at their next hourly check. They verify everything themselves; see internal/relay.
        env:
          NOSTR_ANNOUNCE_KEY: ${{ secrets.NOSTR_ANNOUNCE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$NOSTR_ANNOUNCE_KEY" ]; then echo "NOSTR_ANNOUNCE_KEY not set; skipping"; exit 0; fi
          core=$(python3 -c 'import json;print(json.load(open("panel/releases/latest.json"))["version"])')
          catalog=$(sha256sum panel/marketplace/catalog.json | cut -d" " -f1)
          sleep 30  # let the CDN pick up the new files first
          go run ./cmd/rubi-announce -core "$core" -catalog "$catalog"
