name: betatest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Browser beta test
        run: scripts/sandbox/betatest.sh
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: betatest
          path: |
            /workspace/betatest
            .sandbox/betatest
          if-no-files-found: ignore
